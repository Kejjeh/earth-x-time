<style>
/*@FONTS@*/

/* ============================================================
   TOKENS
   Palette: bathymetric slate ground, survey-sheet light ground.
   One chrome accent only — cyanotype — reserved for knowledge-time.
   Earth-time chrome is neutral; the stratigraphic ribbon supplies
   its colour, and that ribbon is where the boldness is spent.
   ============================================================ */
:root {
  --abyss:      #0A1317;
  --shale:      #101E25;
  --shale-2:    #162A33;
  --shale-3:    #1E3742;
  --chalk:      #DDE7E7;
  --chalk-dim:  #90A5AB;
  /* chalk-faint is the colour of every small string that explains what the axes
     are: the group labels, the presets, the resolver note, the search note, the
     empty panel. At 9.5-12px none of them is large text, so none gets the 3:1
     exemption and all of them need 4.5:1. It used to sit at 3.32:1 here and
     2.98:1 in light mode - where it got LIGHTER, which is backwards. Both values
     now clear 4.5:1 against the worst surface they land on, --shale-2. */
  --chalk-faint:#86959A;
  --cyanotype:  #55A0C6;
  --cyanotype-d:#2C6D91;
  --ochre:      #D08A44;
  --rule:       rgba(146,180,190,0.16);
  --rule-soft:  rgba(146,180,190,0.08);
  --sheen:      rgba(255,255,255,0.04);
  --ocean-hi:   #14323D;
  --ocean-lo:   #050C11;
  --land:       #33575F;
  --land-edge:  #82ABB5;
  --plate:      rgba(208,138,68,0.34);

  --sub-geology:       #C87F3C;
  --sub-chemistry:     #CFB74E;
  --sub-biology:       #6FA85F;
  --sub-evolution:     #3E9E96;
  --sub-astronomy:     #7A8FD4;
  --sub-human_history: #D0574F;

  --font-display: 'xt-cond', 'IBM Plex Sans Condensed', 'Helvetica Neue', Arial, sans-serif;
  --font-body:    'xt-sans', 'IBM Plex Sans', system-ui, sans-serif;
  --font-data:    'xt-mono', 'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;

  --rail-w: 104px;
  --panel-w: 348px;
  --r: 2px;
  color-scheme: dark;
}

@media (prefers-color-scheme: light) {
  :root {
    --abyss:      #E6EBE9;
    --shale:      #F1F4F2;
    --shale-2:    #E4EAE9;
    --shale-3:    #D6DFDE;
    --chalk:      #101D23;
    --chalk-dim:  #4E656D;
    --chalk-faint:#58676C;
    --cyanotype:  #2A6D91;
    --cyanotype-d:#1B4E69;
    --ochre:      #A2622A;
    --rule:       rgba(20,50,62,0.20);
    --rule-soft:  rgba(20,50,62,0.09);
    --sheen:      rgba(10,30,40,0.03);
    --ocean-hi:   #8FAEB8;
    --ocean-lo:   #5F818C;
    --land:       #F4F7F4;
    --land-edge:  #5A757E;
    --plate:      rgba(162,98,42,0.40);

    --sub-geology:       #A2622A;
    --sub-chemistry:     #957F1B;
    --sub-biology:       #4A7C3E;
    --sub-evolution:     #1F7871;
    --sub-astronomy:     #4B60A8;
    --sub-human_history: #AF3A32;
    color-scheme: light;
  }
}

/* The viewer's explicit toggle must win over the media query in BOTH directions. */
:root[data-theme="dark"] {
  --abyss:#0A1317; --shale:#101E25; --shale-2:#162A33; --shale-3:#1E3742;
  --chalk:#DDE7E7; --chalk-dim:#90A5AB; --chalk-faint:#86959A;
  --cyanotype:#55A0C6; --cyanotype-d:#2C6D91; --ochre:#D08A44;
  --rule:rgba(146,180,190,0.16); --rule-soft:rgba(146,180,190,0.08);
  --sheen:rgba(255,255,255,0.04);
  --ocean-hi:#14323D; --ocean-lo:#050C11; --land:#33575F; --land-edge:#82ABB5;
  --plate:rgba(208,138,68,0.34);
  --sub-geology:#C87F3C; --sub-chemistry:#CFB74E; --sub-biology:#6FA85F;
  --sub-evolution:#3E9E96; --sub-astronomy:#7A8FD4; --sub-human_history:#D0574F;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --abyss:#E6EBE9; --shale:#F1F4F2; --shale-2:#E4EAE9; --shale-3:#D6DFDE;
  --chalk:#101D23; --chalk-dim:#4E656D; --chalk-faint:#58676C;
  --cyanotype:#2A6D91; --cyanotype-d:#1B4E69; --ochre:#A2622A;
  --rule:rgba(20,50,62,0.20); --rule-soft:rgba(20,50,62,0.09);
  --sheen:rgba(10,30,40,0.03);
  --ocean-hi:#8FAEB8; --ocean-lo:#5F818C; --land:#F4F7F4; --land-edge:#5A757E;
  --plate:rgba(162,98,42,0.40);
  --sub-geology:#A2622A; --sub-chemistry:#957F1B; --sub-biology:#4A7C3E;
  --sub-evolution:#1F7871; --sub-astronomy:#4B60A8; --sub-human_history:#AF3A32;
  color-scheme: light;
}

/* ============================================================ BASE */
/* Must come before any class sets `display`. The UA rule for [hidden] is a bare
   element-less selector, so `.diffwrap { display: flex }` outranks it and the
   modal stays on screen covering the globe however many times JS sets .hidden. */
[hidden] { display: none !important; }

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--abyss);
  color: var(--chalk);
  font-family: var(--font-body);
  font-size: 13px;
  line-height: 1.45;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
button { background: none; border: none; cursor: pointer; padding: 0; }
:focus-visible {
  outline: 2px solid var(--cyanotype);
  outline-offset: 2px;
}
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.lbl {
  font-family: var(--font-display);
  text-transform: uppercase;
  letter-spacing: 0.14em;
  font-size: 10px;
  font-weight: 600;
  color: var(--chalk-faint);
}
.sr { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }

/* ============================================================ SHELL */
.app {
  display: grid;
  grid-template-columns: var(--panel-w) minmax(0,1fr) var(--rail-w);
  grid-template-rows: minmax(0,1fr) auto;
  /* Viewport units, not height:100%. A percentage height resolves against the
     parent's height, so it needs an unbroken chain of sized ancestors all the
     way to <html>. Standalone that holds, because this file supplies its own
     html and body — but embedded in a host page it does not, and the whole
     layout collapses to zero with the globe inside it. */
  height: 100vh;
  height: 100dvh;
  min-height: 420px;
  width: 100%;
}
.instrument { grid-column: 1; grid-row: 1 / span 2; border-right: 1px solid var(--rule);
  background: var(--shale); display: flex; flex-direction: column; min-height: 0; }
.stage { grid-column: 2; grid-row: 1; position: relative; min-height: 0; overflow: hidden; }
/* Imagery of a lit planet wants to sit in space, not on a slate panel. */
.stage.space { background: radial-gradient(ellipse at 50% 45%, #0a1220 0%, #05080e 60%, #03050a 100%); }
.krail { grid-column: 3; grid-row: 1 / span 2; border-left: 1px solid var(--rule);
  background: var(--shale); position: relative; display: flex; flex-direction: column; }
.chron { grid-column: 2; grid-row: 2; border-top: 1px solid var(--rule); background: var(--shale);
  position: relative; }

/* ============================================================ IDENTITY */
.ident { padding: 14px 16px 12px; border-bottom: 1px solid var(--rule); flex: none; }
.ident h1 {
  font-family: var(--font-display);
  font-size: 21px; font-weight: 600; margin: 0;
  letter-spacing: 0.06em; text-transform: uppercase;
  display: flex; align-items: baseline; gap: 8px;
}
.ident h1 .x { color: var(--cyanotype); font-size: 17px; }
.ident p { margin: 5px 0 0; font-size: 11.5px; color: var(--chalk-dim); line-height: 1.5; max-width: 46ch; }

/* ============================================================ CONTROLS */
.controls { flex: none; border-bottom: 1px solid var(--rule); }
.group { padding: 11px 16px; border-bottom: 1px solid var(--rule-soft); }
.group:last-child { border-bottom: none; }
.group > .lbl { display: block; margin-bottom: 7px; }

.seg { display: flex; border: 1px solid var(--rule); border-radius: var(--r); overflow: hidden; }
.seg button {
  flex: 1 1 0; padding: 6px 4px; font-size: 10.5px; font-family: var(--font-display);
  text-transform: uppercase; letter-spacing: 0.07em; color: var(--chalk-dim);
  border-right: 1px solid var(--rule); transition: background .12s, color .12s;
  min-width: 0;
}
.seg button:last-child { border-right: none; }
.seg button:hover { background: var(--sheen); color: var(--chalk); }
.seg button[aria-pressed="true"] { background: var(--shale-3); color: var(--chalk); }
.resolver-note { margin: 6px 0 0; font-size: 10.5px; color: var(--chalk-faint); line-height: 1.45; min-height: 2.9em; }

.subs { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 6px; }
.sub {
  display: flex; align-items: center; gap: 7px; padding: 3px 5px 3px 3px;
  border-radius: var(--r); cursor: pointer; text-align: left; width: 100%;
  font-size: 11.5px; color: var(--chalk-dim); transition: background .12s, color .12s;
}
.sub:hover { background: var(--sheen); }
.sub .swatch {
  width: 9px; height: 9px; flex: none; border-radius: 50%;
  border: 1.5px solid var(--sw); background: var(--sw);
  transition: background .12s, transform .12s;
}
.sub[data-on="false"] { color: var(--chalk-faint); }
.sub[data-on="false"] .swatch { background: transparent; }
.sub[data-focus="true"] { background: var(--shale-3); color: var(--chalk); }
.sub[data-focus="true"] .swatch { transform: scale(1.25); }
.sub .cnt { margin-left: auto; font-family: var(--font-data); font-size: 10px; color: var(--chalk-faint); font-variant-numeric: tabular-nums; }
.subs-hint { margin: 7px 0 0; font-size: 10.5px; color: var(--chalk-faint); }

/* ============================================================ SEARCH */
.search {
  width: 100%; box-sizing: border-box;
  background: var(--shale-2); border: 1px solid var(--rule); border-radius: var(--r);
  color: var(--chalk); font-family: var(--font-body); font-size: 12.5px;
  padding: 7px 9px; outline: none; transition: border-color .12s, background .12s;
}
.search::placeholder { color: var(--chalk-faint); }
.search:focus { border-color: var(--cyanotype); background: var(--shale-3); }
.results {
  list-style: none; margin: 6px 0 0; padding: 0;
  max-height: 236px; overflow-y: auto; scrollbar-width: thin;
  border: 1px solid var(--rule); border-radius: var(--r); background: var(--shale-2);
}
.results:empty { display: none; border: 0; }
.results li {
  display: flex; align-items: baseline; gap: 8px; cursor: pointer;
  padding: 6px 9px; font-size: 12px; color: var(--chalk-dim);
  border-bottom: 1px solid var(--rule-soft);
}
.results li:last-child { border-bottom: 0; }
.results li:hover, .results li[aria-selected="true"] { background: var(--shale-3); color: var(--chalk); }
.results li .when {
  margin-left: auto; flex: none; font-family: var(--font-data); font-size: 10px;
  color: var(--chalk-faint); font-variant-numeric: tabular-nums; white-space: nowrap;
}
.results li .when.later { color: var(--cyanotype); }
.results li mark { background: none; color: var(--ochre); font-weight: 600; }
.search-note { margin: 6px 0 0; font-size: 10.5px; color: var(--chalk-faint); }

/* ============================================================ DETAIL */
.detail { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; min-height: 0; scrollbar-width: thin; }
.detail::-webkit-scrollbar { width: 8px; }
.detail::-webkit-scrollbar-thumb { background: var(--shale-3); border-radius: 4px; }
.empty { padding: 26px 18px; color: var(--chalk-faint); font-size: 12px; line-height: 1.6; }
.empty strong { color: var(--chalk-dim); font-weight: 600; display: block; margin-bottom: 6px;
  font-family: var(--font-display); text-transform: uppercase; letter-spacing: .1em; font-size: 10px; }
.empty ul { margin: 10px 0 0; padding-left: 15px; }
.empty li { margin-bottom: 5px; }

.dt-head { padding: 14px 16px 12px; border-bottom: 1px solid var(--rule); }
.dt-kind { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.dt-kind .tag {
  font-family: var(--font-display); text-transform: uppercase; letter-spacing: .12em;
  font-size: 9.5px; padding: 2px 6px; border: 1px solid var(--rule); border-radius: var(--r);
  color: var(--chalk-faint);
}
.dt-head h2 { margin: 0; font-size: 17px; font-weight: 600; font-family: var(--font-display);
  letter-spacing: .01em; line-height: 1.2; text-wrap: balance; }
.dt-stmt { margin: 8px 0 0; font-size: 12.5px; color: var(--chalk-dim); line-height: 1.55; }

.resolved { padding: 12px 16px; border-bottom: 1px solid var(--rule); background: var(--shale-2); }
.resolved .big { font-family: var(--font-data); font-size: 20px; font-weight: 600;
  font-variant-numeric: tabular-nums; letter-spacing: -0.02em; line-height: 1.15; }
.resolved .pm { font-size: 12px; color: var(--chalk-dim); font-weight: 400; }
.resolved .prov { margin-top: 7px; font-size: 10.5px; color: var(--chalk-faint); line-height: 1.5; }
.resolved .prov b { color: var(--chalk-dim); font-weight: 600; }
.spread-note { margin-top: 6px; font-size: 10.5px; color: var(--ochre); }

.sect { padding: 12px 16px; border-bottom: 1px solid var(--rule); }
.sect > .lbl { display: block; margin-bottom: 9px; }

.claim {
  border-left: 2px solid var(--cl, var(--rule)); padding: 0 0 0 10px; margin-bottom: 12px;
  position: relative;
}
.claim:last-child { margin-bottom: 0; }
.claim .row1 { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.claim .date { font-family: var(--font-data); font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
.claim .st {
  font-family: var(--font-display); text-transform: uppercase; letter-spacing: .1em;
  font-size: 9px; padding: 1px 5px; border-radius: var(--r); border: 1px solid currentColor;
}
.claim[data-win="true"] .date { color: var(--chalk); }
.claim[data-win="false"] { opacity: .72; }
.claim .stmt { margin: 4px 0 0; font-size: 11.5px; color: var(--chalk-dim); line-height: 1.5; }
.claim .src { margin: 4px 0 0; font-size: 10.5px; color: var(--chalk-faint); line-height: 1.45; }
.claim .src .kt { font-family: var(--font-data); color: var(--cyanotype); }

/* Outbound source links. The DOI link and the "no DOI" link are deliberately
   the same weight: an unchecked attribution is not a lesser thing to show than
   a checked one, it is the thing a reader most needs to know about. */
a.doi { color: var(--chalk-dim); text-decoration: underline;
        text-decoration-color: var(--rule); text-underline-offset: 2px; }
a.doi:hover, a.doi:focus-visible { color: var(--cyanotype);
        text-decoration-color: var(--cyanotype); }
a.doi:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--cyanotype); border-radius: 2px; }
a.doi .doi-mark { font-family: var(--font-data); font-size: 8.5px; letter-spacing: .06em;
        margin-left: 4px; padding: 0 3px; border: 1px solid var(--rule); border-radius: 2px;
        color: var(--chalk-faint); vertical-align: 1px; }
a.doi:hover .doi-mark, a.doi:focus-visible .doi-mark { border-color: var(--cyanotype); color: var(--cyanotype); }
a.doi.none { color: var(--chalk-faint); font-style: italic; text-decoration-style: dotted; }

/* The absent roster. Grouped by the one action that would bring a row back, so
   the list reads as a set of things to do rather than a list of failures. */
.absent { margin-top: 16px; border-top: 1px solid var(--rule); padding-top: 10px; }
.absent summary { font-size: 11px; color: var(--chalk-dim); cursor: pointer;
  list-style: none; padding: 2px 0; }
.absent summary::-webkit-details-marker { display: none; }
.absent summary::before { content: '▸'; display: inline-block; width: 12px;
  color: var(--chalk-faint); transition: transform .12s ease; }
.absent[open] summary::before { transform: rotate(90deg); }
.absent summary:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--cyanotype); border-radius: 2px; }
.absent-fix { margin: 10px 0 2px; font-size: 9.5px; letter-spacing: .07em;
  text-transform: uppercase; color: var(--chalk-faint); }
.absent ul { margin: 0; padding: 0; list-style: none; }
@media (prefers-reduced-motion: reduce) { .absent summary::before { transition: none; } }
.claim .winner-flag {
  font-family: var(--font-display); text-transform: uppercase; letter-spacing: .1em;
  font-size: 9px; color: var(--ochre);
}
.claim .hist { margin: 5px 0 0; padding: 0; list-style: none; }
.claim .hist li { font-size: 10px; color: var(--chalk-faint); font-family: var(--font-data);
  display: flex; gap: 6px; line-height: 1.5; }
.claim .hist li span:first-child { color: var(--chalk-dim); flex: none; }
.claim.pending { opacity: .38; }
.claim.pending .date { text-decoration: line-through; }

.st-consensus  { color: var(--sub-biology); }
.st-contested  { color: var(--sub-chemistry); }
.st-proposed   { color: var(--cyanotype); }
.st-superseded { color: var(--chalk-faint); }

.edge-link {
  display: flex; align-items: baseline; gap: 8px; width: 100%; text-align: left;
  padding: 6px 8px 6px 6px; border-radius: var(--r); margin-bottom: 2px;
  transition: background .12s;
}
.edge-link:hover { background: var(--shale-3); }
.edge-link .arrow { font-family: var(--font-data); color: var(--chalk-faint); flex: none; font-size: 12px; }
.edge-link .who { font-size: 12px; color: var(--chalk); font-weight: 600; }
.edge-link .mech { font-size: 10.5px; color: var(--chalk-faint); display: block; margin-top: 1px; }
.edge-link[data-live="false"] { opacity: .34; }
.edge-link[data-live="false"] .who { text-decoration: line-through; }

.meta-row { display: flex; gap: 8px; font-size: 11px; margin-bottom: 5px; }
.meta-row .k { color: var(--chalk-faint); width: 96px; flex: none; }
.meta-row .v { color: var(--chalk-dim); }
.flagged { color: var(--ochre); }

/* ============================================================ STAGE */
#globe { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
/* The globe is exactly the size of .stage, and .stage is overflow:hidden, so the
   shared :focus-visible ring — painted 2px OUTSIDE the border box — is clipped
   away completely. On a role="application" element that swallows the arrow keys,
   that leaves a keyboard user with no sign of where focus is. Paint it inside. */
#globe:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--cyanotype); }
#globe.dragging { cursor: grabbing; }
/* The stage's own background does not follow the theme: .stage.space is a fixed
   dark gradient with satellite imagery over it. The text on top did follow the
   theme, so in light mode a dark token landed on a near-black stage - #epistemic
   measured 3.25:1 there, and .as-of and the legend 2.74:1 over the chart ground.
   No single theme-independent colour fixes both, because the backdrop is dark
   regardless under imagery and theme-following under Chart. The discriminator is
   the basemap, and .stage.space is already toggled with it. */
.stage.space { --stage-fg: #C6D4D9; --stage-fg-dim: #A3B5BB; }
.stage       { --stage-fg: var(--chalk-dim); --stage-fg-dim: var(--chalk-dim); }
.stage-tl { position: absolute; top: 12px; left: 14px; pointer-events: none; max-width: 60%; }
.as-of {
  font-family: var(--font-display); text-transform: uppercase; letter-spacing: .14em;
  font-size: 10px; color: var(--stage-fg-dim);
}
.as-of b { color: var(--cyanotype); font-family: var(--font-data); letter-spacing: 0; font-size: 12px; }
.epistemic { margin: 4px 0 0; font-size: 12px; color: var(--stage-fg); line-height: 1.5;
  max-width: 52ch; text-wrap: balance; }

/* A one-finger vertical swipe has to scroll the page. With touch-action:none on

   or knowledge-time from 2026 to 1979, with scrollY still 0 — while on the
   timeline, whose pan reads only clientX, it did nothing at all. That is 718px
   of an 870px first screen that refuses to scroll.

   pan-y hands the vertical axis back to the browser and keeps everything

   over, which the pointer bookkeeping in src/80_boot.js already handles.

   vertical drag-scrub is gone on touch. Tap-to-set stays, so do Home/End and
   the arrow keys, and an unrequested 47-year jump is worse than losing a scrub.
   Vertical rotation of the globe survives through the two-finger path, whose
   midpoint handler already moves both lam and phi. */
